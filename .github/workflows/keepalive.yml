# Supabase 무료 플랜은 7일 동안 요청이 없으면 프로젝트가 일시정지됩니다.
# 주 2회 공개 anon 키로 members 표를 1건 조회해 "사용 중"으로 유지합니다. 키·주소는 supabase-config.js 에서 읽습니다.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 21 * * 1,4" # 월·목 06:17 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST
        run: |
          URL=$(grep -oE 'SUPABASE_URL\s*=\s*"[^"]+"' supabase-config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SUPABASE_ANON_KEY\s*=\s*"[^"]+"' supabase-config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "supabase-config.js 에 연결 정보가 없어 건너뜁니다."; exit 0; fi
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" "$URL/rest/v1/members?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE: $(head -c 200 /tmp/out.json)"
          [ "$CODE" = "200" ] || exit 1
